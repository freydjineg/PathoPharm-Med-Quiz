<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PathoPharm Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d14;
    --surface: #111520;
    --surface2: #171c2e;
    --border: #1e2640;
    --accent: #4f8ef7;
    --accent2: #7c5cf7;
    --green: #2dd4a0;
    --red: #f75f5f;
    --yellow: #f7c948;
    --text: #e8ecf5;
    --muted: #6b7899;
    --pill: #1a2035;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(79,142,247,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(124,92,247,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .screen { display: none; position: relative; z-index: 1; }
  .screen.active { display: block; }

  /* ===== HOME SCREEN ===== */
  #home {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px;
    animation: fadeUp 0.5s ease;
  }

  .logo-area { text-align: center; margin-bottom: 48px; }
  .logo-tag {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.2);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .logo-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    font-weight: 800;
    background: linear-gradient(135deg, #e8ecf5 30%, #4f8ef7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  .logo-sub {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
  }

  .config-grid { display: grid; gap: 16px; }

  .config-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: border-color 0.2s;
  }
  .config-card:hover { border-color: rgba(79,142,247,0.3); }

  .config-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .q-count-row {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .q-btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    width: 64px; height: 64px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .q-btn:hover { border-color: var(--accent); color: var(--text); }
  .q-btn.selected { border-color: var(--accent); background: rgba(79,142,247,0.15); color: var(--accent); }

  .custom-input-row {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
  }
  .custom-input-row input {
    width: 100px;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .custom-input-row input:focus { border-color: var(--accent); }
  .custom-input-row label { color: var(--muted); font-size: 13px; }

  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .mod-item {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .mod-item:hover { border-color: var(--accent2); }
  .mod-item.selected { border-color: var(--accent2); background: rgba(124,92,247,0.12); }
  .mod-num {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--accent2);
    letter-spacing: 1px;
  }
  .mod-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .mod-count {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .slider-wrap { display: flex; flex-direction: column; gap: 8px; }
  .slider-top { display: flex; justify-content: space-between; align-items: center; }
  .slider-val {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
  }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(79,142,247,0.5);
  }
  .slider-hint { font-size: 12px; color: var(--muted); }

  .selected-modules-summary {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(124,92,247,0.08);
    border: 1px solid rgba(124,92,247,0.2);
    border-radius: 10px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    min-height: 36px;
  }

  .start-btn {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 14px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.2s;
    box-shadow: 0 8px 30px rgba(79,142,247,0.25);
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(79,142,247,0.35);
  }
  .start-btn:active { transform: translateY(0); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ===== QUIZ SCREEN ===== */
  #quiz {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    animation: fadeUp 0.4s ease;
  }

  .quiz-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
  }
  .home-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .home-btn:hover { color: var(--text); border-color: var(--accent); }

  .progress-area { flex: 1; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .q-meta {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .q-pill {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--pill);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .q-pill.mod { color: var(--accent2); border-color: rgba(124,92,247,0.3); background: rgba(124,92,247,0.08); }
  .q-pill.topic { color: var(--accent); border-color: rgba(79,142,247,0.3); background: rgba(79,142,247,0.08); }

  .q-text {
    font-family: 'Syne', sans-serif;
    font-size: clamp(17px, 3vw, 21px);
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 28px;
    color: var(--text);
  }

  .drug-highlight {
    color: var(--accent);
    background: rgba(79,142,247,0.1);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .answer-area { margin-bottom: 20px; }
  .answer-input {
    width: 100%;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    resize: vertical;
    min-height: 80px;
    transition: border-color 0.2s;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .submit-area { display: flex; gap: 10px; }

  .btn-reveal {
    flex: 1;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(79,142,247,0.2);
  }
  .btn-reveal:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(79,142,247,0.3); }

  /* ANSWER REVEALED */
  .answer-reveal {
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    animation: fadeUp 0.3s ease;
  }

  .correct-answer-block {
    padding: 18px 20px;
    background: rgba(45, 212, 160, 0.08);
    border-bottom: 1px solid rgba(45, 212, 160, 0.15);
  }
  .ca-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .ca-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
  }

  .rationale-block { padding: 20px; background: var(--surface); }
  .rat-section { margin-bottom: 16px; }
  .rat-section:last-child { margin-bottom: 0; }
  .rat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .rat-label.why { color: var(--green); }
  .rat-label.wrong { color: var(--red); }
  .rat-label.pearl { color: var(--yellow); }
  .rat-text { font-size: 14px; color: #b0bcd4; line-height: 1.6; }
  .wrong-item { margin-bottom: 6px; }
  .wrong-choice {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--red);
    background: rgba(247,95,95,0.08);
    border: 1px solid rgba(247,95,95,0.2);
    padding: 2px 8px;
    border-radius: 6px;
    margin-right: 6px;
    margin-bottom: 4px;
  }

  .mc-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .mc-option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mc-option:hover:not(.disabled) { border-color: var(--accent); background: rgba(79,142,247,0.05); }
  .mc-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.1); }
  .mc-option.correct { border-color: var(--green); background: rgba(45,212,160,0.08); }
  .mc-option.incorrect { border-color: var(--red); background: rgba(247,95,95,0.08); }
  .mc-option.disabled { cursor: default; }
  .mc-option.show-correct { border-color: var(--green); background: rgba(45,212,160,0.05); }

  .opt-letter {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .mc-option.selected .opt-letter { background: var(--accent); color: white; }
  .mc-option.correct .opt-letter { background: var(--green); color: #0a0d14; }
  .mc-option.incorrect .opt-letter { background: var(--red); color: white; }
  .mc-option.show-correct .opt-letter { background: var(--green); color: #0a0d14; }

  .opt-text { font-size: 14px; line-height: 1.5; padding-top: 3px; }

  .nav-row {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.next-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white;
  }
  .nav-btn.next-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79,142,247,0.3); }
  .nav-btn.finish-btn {
    background: linear-gradient(135deg, var(--green), #1fa87d);
    border: none; color: #0a0d14;
    font-weight: 700;
  }

  .loading-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 20px;
    gap: 16px;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 1px; }

  /* ===== RESULTS SCREEN ===== */
  #results {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px;
    text-align: center;
    animation: fadeUp 0.5s ease;
  }
  .result-score {
    font-family: 'Syne', sans-serif;
    font-size: 80px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-score.great { background: linear-gradient(135deg, var(--green), #4fffce); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .result-score.ok { background: linear-gradient(135deg, var(--yellow), #ffaa2c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .result-score.low { background: linear-gradient(135deg, var(--red), #ff9a9a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  .result-label { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
  .result-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 12px;
  }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
  }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.blue { color: var(--accent); }
  .stat-lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .result-actions { display: flex; gap: 12px; flex-direction: column; }
  .btn-again {
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(79,142,247,0.25);
  }
  .btn-again:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,142,247,0.35); }
  .btn-home-res {
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-home-res:hover { border-color: var(--accent); color: var(--text); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    background: rgba(247,95,95,0.08);
    border: 1px solid rgba(247,95,95,0.25);
    border-radius: 12px;
    padding: 16px 20px;
    color: var(--red);
    font-size: 14px;
    margin-bottom: 16px;
    font-family: 'DM Mono', monospace;
  }

  /* Question map */
  .q-map {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .q-dot {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .q-dot:hover { border-color: var(--accent); }
  .q-dot.current { border-color: var(--accent); background: rgba(79,142,247,0.15); color: var(--accent); }
  .q-dot.answered { background: rgba(45,212,160,0.1); border-color: rgba(45,212,160,0.3); color: var(--green); }
  .q-dot.answered.wrong { background: rgba(247,95,95,0.08); border-color: rgba(247,95,95,0.25); color: var(--red); }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen active">
  <div class="logo-area">
    <div class="logo-tag">STUDY TOOL</div>
    <div class="logo-title">PathoPharm<br>Quiz Engine</div>
    <div class="logo-sub">Modules 2 – 11 · AI-Generated · Unique Every Time</div>
  </div>

  <div class="config-grid">

    <!-- Question Count -->
    <div class="config-card">
      <div class="config-label">Number of Questions</div>
      <div class="q-count-row" id="qCountRow">
        <button class="q-btn" onclick="selectQCount(5)">5</button>
        <button class="q-btn" onclick="selectQCount(10)">10</button>
        <button class="q-btn" onclick="selectQCount(15)">15</button>
        <button class="q-btn" onclick="selectQCount(20)">20</button>
      </div>
      <div class="custom-input-row">
        <input type="number" id="customQ" placeholder="##" min="1" max="50" oninput="selectQCount(parseInt(this.value)||0, true)">
        <label>custom amount (max 50)</label>
      </div>
    </div>

    <!-- Module Selection -->
    <div class="config-card">
      <div class="config-label">Select Modules (pick one or more)</div>
      <div class="modules-grid" id="modulesGrid"></div>
    </div>

    <!-- Module % Split -->
    <div class="config-card" id="splitCard" style="display:none;">
      <div class="config-label">Focus Weight</div>
      <div id="splitControls"></div>
      <div class="selected-modules-summary" id="splitSummary"></div>
    </div>

  </div>

  <div id="homeError" class="error-box" style="display:none;margin-top:16px;"></div>
  <button class="start-btn" id="startBtn" onclick="startQuiz()">Generate Quiz →</button>
</div>

<!-- QUIZ SCREEN -->
<div id="quiz" class="screen">
  <div class="quiz-topbar">
    <button class="home-btn" onclick="goHome()">← Home</button>
    <div class="progress-area">
      <div class="progress-label">
        <span id="progLabel">Question 1 of 10</span>
        <span id="progPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progBar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="q-map" id="qMap"></div>

  <div id="quizContent">
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">GENERATING QUESTIONS...</div>
    </div>
  </div>
</div>

<!-- RESULTS SCREEN -->

const MODULE_NAMES = Object.keys(DRUG_DATA);

// State
let selectedQCount = 10;
let selectedModules = [...MODULE_NAMES];
let moduleWeights = {};
let questions = [];
let currentQ = 0;
let answers = {}; // {index: {selected, correct, revealed}}

// Initialize weights
MODULE_NAMES.forEach(m => moduleWeights[m] = 1);

function initHome() {
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = '';
  MODULE_NAMES.forEach(mod => {
    const count = DRUG_DATA[mod].drugs.length;
    const div = document.createElement('div');
    div.className = 'mod-item selected';
    div.id = 'mod_' + mod.replace(/\s+/g,'_');
    div.onclick = () => toggleModule(mod);
    div.innerHTML = `<div class="mod-num">${mod.toUpperCase()}</div><div class="mod-name">${getModSubtitle(mod)}</div><div class="mod-count">${count} drugs</div>`;
    grid.appendChild(div);
  });
  updateSplitControls();
}

function getModSubtitle(mod) {
  const map = {
    "Module 2": "Core Pharmacology",
    "Module 3": "Immune & Infection",
    "Module 4": "Hematology & Cancer",
    "Module 5": "Nervous System & Pain",
    "Module 6": "Cardiovascular",
    "Module 7": "Pulmonary",
    "Module 8": "Renal & Urinary",
    "Module 9": "Endocrine & Diabetes",
    "Module 10": "GI & Hepatobiliary",
    "Module 11": "Musculoskeletal"
  };
  return map[mod] || mod;
}

function toggleModule(mod) {
  const idx = selectedModules.indexOf(mod);
  if (idx === -1) {
    selectedModules.push(mod);
  } else {
    if (selectedModules.length === 1) return; // keep at least one
    selectedModules.splice(idx, 1);
  }
  const el = document.getElementById('mod_' + mod.replace(/\s+/g,'_'));
  el.classList.toggle('selected', selectedModules.includes(mod));
  updateSplitControls();
}

function selectQCount(n, custom=false) {
  if (!custom) {
    document.getElementById('customQ').value = '';
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.q-btn').forEach(b => {
      if (parseInt(b.textContent) === n) b.classList.add('selected');
    });
  }
  selectedQCount = n;
}

function updateSplitControls() {
  const card = document.getElementById('splitCard');
  const container = document.getElementById('splitControls');
  const summary = document.getElementById('splitSummary');

  if (selectedModules.length <= 1) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  container.innerHTML = '';

  selectedModules.forEach(mod => {
    const w = moduleWeights[mod] || 1;
    const div = document.createElement('div');
    div.style.marginBottom = '14px';
    div.innerHTML = `
      <div class="slider-top">
        <span style="font-size:13px;color:var(--text)">${mod}: <em style="color:var(--muted);font-style:normal">${getModSubtitle(mod)}</em></span>
        <span class="slider-val" id="wval_${mod.replace(/\s+/g,'_')}">${w}x</span>
      </div>
      <input type="range" min="1" max="5" value="${w}" oninput="updateWeight('${mod}', parseInt(this.value))">
      <div class="slider-hint">Weight: 1 = equal share · 5 = heavily weighted</div>
    `;
    container.appendChild(div);
  });
  updateSummary();
}

function updateWeight(mod, val) {
  moduleWeights[mod] = val;
  const el = document.getElementById('wval_' + mod.replace(/\s+/g,'_'));
  if (el) el.textContent = val + 'x';
  updateSummary();
}

function updateSummary() {
  const summary = document.getElementById('splitSummary');
  const total = selectedModules.reduce((s,m) => s + (moduleWeights[m]||1), 0);
  const parts = selectedModules.map(m => {
    const pct = Math.round(((moduleWeights[m]||1)/total)*100);
    return `${m}: ${pct}%`;
  });
  summary.textContent = parts.join(' · ');
}

function buildDrugPool() {
  const pool = [];
  const total = selectedModules.reduce((s,m) => s + (moduleWeights[m]||1), 0);
  selectedModules.forEach(mod => {
    const w = moduleWeights[mod] || 1;
    const count = Math.max(1, Math.round((w/total) * selectedQCount));
    DRUG_DATA[mod].full.forEach(drug => {
      for (let i = 0; i < w; i++) pool.push({...drug, module: mod});
    });
  });
  return pool;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function startQuiz() {
  if (!selectedQCount || selectedQCount < 1) {
    showHomeError('Please select a number of questions.');
    return;
  }
  if (selectedModules.length === 0) {
    showHomeError('Please select at least one module.');
    return;
  }
  document.getElementById('homeError').style.display = 'none';

  showScreen('quiz');
  document.getElementById('quizContent').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">GENERATING QUESTIONS...</div>
    </div>`;

  // Build weighted drug pool
  const pool = buildDrugPool();
  const shuffled = shuffleArray(pool);

  // Pick drugs for questions (respect count)
  const picked = shuffled.slice(0, Math.min(selectedQCount, shuffled.length));
  // If we need more than pool has, wrap around
  let finalPicked = picked;
  if (picked.length < selectedQCount) {
    const extra = shuffled.slice(0, selectedQCount - picked.length);
    finalPicked = [...picked, ...extra];
  }

  // Generate questions via AI
  const prompt = buildPrompt(finalPicked);
  try {
    const qs = await callClaude(prompt);
    questions = qs;
    answers = {};
    currentQ = 0;
    renderQuizMap();
    renderQuestion(0);
  } catch(e) {
    document.getElementById('quizContent').innerHTML = `<div class="error-box">Failed to generate questions: ${e.message}. Please try again.</div>`;
  }
}

function buildPrompt(drugs) {
  const drugList = drugs.map((d,i) => `${i+1}. Drug: ${d.name} | Module: ${d.module} | Class: ${d.class} | MOA: ${d.moa} | Indications: ${d.indications} | Contraindications: ${d.contraindications} | Pearls: ${d.pearls}`).join('\n');

  return `You are a pharmacology exam question generator. Generate exactly ${drugs.length} unique multiple-choice questions based on these drugs. Each question MUST focus on ONE of: mechanism of action (MOA), indications, OR contraindications. Vary the question types.

DRUG LIST:
${drugList}

RULES:
- Each question targets a DIFFERENT drug from the list (use the drug at the same index as the question)
- QUESTION TYPES — choose the most appropriate style per question:
  * "IDENTIFY" style: Student must figure out WHICH drug is being described. Do NOT name the drug anywhere in the stem or choices. Refer to it as "this medication" or describe a clinical scenario. The answer choices will be 4 different drug names. Set "showDrugName": false.
  * "ABOUT" style: The drug IS named in the question stem, and the student must answer something about it (e.g. MOA, indication, contraindication, side effect). Answer choices are clinical concepts, not drug names. Set "showDrugName": true.
- Vary the mix: roughly half IDENTIFY and half ABOUT questions across the set
- CRITICAL for IDENTIFY questions: NEVER mention the drug name, brand name, or suffix (e.g. -pril, -olol, -statin, -cycline) in the stem or choices
- 4 answer choices (A, B, C, D)
- Exactly one correct answer
- Wrong answers must be plausible (real pharmacology concepts, not obvious nonsense)
- The "rationale" section must: (1) name the drug and explain WHY the correct answer is right with clinical detail, (2) explain why EACH wrong choice is incorrect, (3) include the clinical pearl for that drug
- Questions must be UNIQUE and never repeat the same phrasing
- Never reveal the answer in the question stem

Respond ONLY with valid JSON (no markdown, no backticks, no preamble):
{
  "questions": [
    {
      "drugName": "string",
      "module": "string",
      "topic": "MOA" | "Indication" | "Contraindication",
      "showDrugName": true,
      "questionText": "string",
      "choices": {"A": "string", "B": "string", "C": "string", "D": "string"},
      "correctAnswer": "A" | "B" | "C" | "D",
      "rationale": {
        "correct": "string (why the correct answer is right)",
        "wrongAnswers": {"A": "string", "B": "string", "C": "string", "D": "string"},
        "pearl": "string"
      }
    }
  ]
}`;
}

async function callClaude(prompt) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 8000,
      messages: [{ role: "user", content: prompt }]
    })
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error.message);
  const text = data.content.map(i => i.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(clean);
  return parsed.questions;
}

function renderQuizMap() {
  const map = document.getElementById('qMap');
  map.innerHTML = '';
  questions.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (i === currentQ ? ' current' : '');
    dot.id = 'dot_' + i;
    dot.textContent = i + 1;
    dot.onclick = () => navigateTo(i);
    if (answers[i]) {
      dot.classList.add('answered');
      if (answers[i].selected && answers[i].selected !== answers[i].correct) {
        dot.classList.add('wrong');
      }
    }
    map.appendChild(dot);
  });
}

function navigateTo(idx) {
  currentQ = idx;
  renderQuizMap();
  renderQuestion(idx);
}

function renderQuestion(idx) {
  const q = questions[idx];
  if (!q) return;

  const ans = answers[idx];
  const revealed = ans && ans.revealed;
  const total = questions.length;
  const pct = Math.round((idx / total) * 100);

  document.getElementById('progLabel').textContent = `Question ${idx+1} of ${total}`;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('progBar').style.width = pct + '%';

  let choicesHtml = '';
  const letters = ['A','B','C','D'];
  letters.forEach(l => {
    let cls = 'mc-option';
    if (revealed) {
      cls += ' disabled';
      if (l === q.correctAnswer) cls += ' correct';
      else if (ans && ans.selected === l) cls += ' incorrect';
    } else if (ans && ans.selected === l) {
      cls += ' selected';
    }
    const clickHandler = revealed ? '' : `onclick="selectChoice('${l}')"`;
    choicesHtml += `<div class="${cls}" id="opt_${l}" ${clickHandler}>
      <div class="opt-letter">${l}</div>
      <div class="opt-text">${q.choices[l]}</div>
    </div>`;
  });

  let rationaleHtml = '';
  if (revealed) {
    const wrongHtml = letters.filter(l => l !== q.correctAnswer).map(l =>
      `<div class="wrong-item"><span class="wrong-choice">${l}: ${q.choices[l]}</span><br><span class="rat-text">${q.rationale.wrongAnswers[l]}</span></div>`
    ).join('');
    rationaleHtml = `
      <div class="answer-reveal">
        <div class="correct-answer-block">
          <div class="ca-label">✓ Correct Answer — ${q.correctAnswer}</div>
          <div class="ca-text">${q.choices[q.correctAnswer]}</div>
        </div>
        <div class="rationale-block">
          <div class="rat-section">
            <div class="rat-label why">✓ Why This Is Correct</div>
            <div class="rat-text">${q.rationale.correct}</div>
          </div>
          <div class="rat-section">
            <div class="rat-label wrong">✗ Why Other Choices Are Wrong</div>
            ${wrongHtml}
          </div>
          <div class="rat-section">
            <div class="rat-label pearl">★ Clinical Pearl</div>
            <div class="rat-text">${q.rationale.pearl}</div>
          </div>
        </div>
      </div>`;
  }

  const isLast = idx === total - 1;
  const allAnswered = Object.keys(answers).length >= total;
  const canReveal = ans && ans.selected && !revealed;

  let actionHtml = '';
  if (!revealed) {
    actionHtml = `<button class="btn-reveal" onclick="revealAnswer()" ${!ans?.selected ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>
      Check Answer →
    </button>`;
  } else {
    actionHtml = `<div class="nav-row">
      <button class="nav-btn" onclick="navigateTo(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
      ${isLast
        ? `<button class="nav-btn finish-btn" onclick="finishQuiz()">See Results ✓</button>`
        : `<button class="nav-btn next-btn" onclick="navigateTo(${idx+1})">Next →</button>`
      }
    </div>`;
  }

  document.getElementById('quizContent').innerHTML = `
    <div class="q-meta">
      <span class="q-pill mod">${q.module}</span>
      <span class="q-pill topic">${q.topic}</span>
      ${(revealed || q.showDrugName) ? `<span class="q-pill" style="color:var(--accent);border-color:rgba(79,142,247,0.3);background:rgba(79,142,247,0.08)">${q.drugName}</span>` : ''}
    </div>
    <div class="q-text">${q.questionText}</div>
    <div class="mc-options">${choicesHtml}</div>
    ${rationaleHtml}
    ${actionHtml}
    ${revealed ? '' : `<div class="nav-row" style="margin-top:8px">
      <button class="nav-btn" onclick="navigateTo(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>
      <button class="nav-btn" onclick="navigateTo(${idx+1})" ${idx===total-1?'disabled':''}>Skip →</button>
    </div>`}
  `;
}

function selectChoice(letter) {
  if (!answers[currentQ]) answers[currentQ] = {};
  if (answers[currentQ].revealed) return;
  answers[currentQ].selected = letter;
  answers[currentQ].correct = questions[currentQ].correctAnswer;
  renderQuestion(currentQ);
}

function revealAnswer() {
  if (!answers[currentQ] || !answers[currentQ].selected) return;
  answers[currentQ].revealed = true;
  renderQuizMap();
  renderQuestion(currentQ);
}

function finishQuiz() {
  const total = questions.length;
  let correct = 0;
  questions.forEach((q, i) => {
    if (answers[i] && answers[i].selected === q.correctAnswer) correct++;
  });
  const wrong = total - correct;
  const pct = Math.round((correct/total)*100);

  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statTotal').textContent = total;

  const scoreEl = document.getElementById('resultScore');
  scoreEl.textContent = pct + '%';
  scoreEl.className = 'result-score ' + (pct >= 80 ? 'great' : pct >= 60 ? 'ok' : 'low');

  const labels = ['Keep studying! You\'ve got this. 💪', 'Getting there — review the rationales!', 'Solid work!', 'Great job!', 'Outstanding! 🎉'];
  const labelIdx = pct >= 90 ? 4 : pct >= 80 ? 3 : pct >= 70 ? 2 : pct >= 60 ? 1 : 0;
  document.getElementById('resultLabel').textContent = labels[labelIdx];

  showScreen('results');
}

function goHome() {
  showScreen('home');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showHomeError(msg) {
  const el = document.getElementById('homeError');
  el.textContent = msg;
  el.style.display = 'block';
}

// Init
initHome();
selectQCount(10);
</script>
