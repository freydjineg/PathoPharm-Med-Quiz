<script>
const QUESTION_BANK = [
  // MODULE 2: Acetaminophen
  {drug:"Acetaminophen",module:"Module 2",topic:"MOA",showDrugName:false,
   q:"A patient has a mild headache and low-grade fever. The nurse gives a non-opioid analgesic that acts centrally on the hypothalamic heat-regulating center. Unlike NSAIDs, it does NOT inhibit peripheral COX enzymes. Which drug was given?",
   choices:{A:"Ibuprofen",B:"Acetaminophen",C:"Aspirin",D:"Naproxen"},correct:"B",
   rationale:{correct:"Acetaminophen works centrally on the hypothalamus to reduce fever and modulate pain. It does not inhibit COX enzymes peripherally, which is why it lacks anti-inflammatory effects and doesn't cause GI upset.",
   wrong:{A:"Ibuprofen is a peripheral COX-1/2 inhibitor with anti-inflammatory effects.",C:"Aspirin irreversibly inhibits both COX-1 and COX-2 peripherally.",D:"Naproxen is also a peripheral NSAID with anti-inflammatory properties."},
   pearl:"Antidote: Acetylcysteine (NAC). Max dose 4g/day. Reduce to 2g/day in liver disease or alcohol users. Found in 600+ OTC products — counsel patients to check ALL labels. #1 cause of acute liver failure in the US from overdose."}},

  {drug:"Acetaminophen",module:"Module 2",topic:"Contraindication",showDrugName:true,
   q:"The nurse is preparing Acetaminophen 650mg PO. Which condition is a contraindication requiring dose reduction or avoidance?",
   choices:{A:"Mild osteoarthritis",B:"Chronic liver disease with daily alcohol use",C:"Hypertension",D:"Mild renal insufficiency (GFR 55)"},correct:"B",
   rationale:{correct:"In liver disease or chronic alcohol use, the toxic metabolite NAPQI cannot be adequately conjugated by glutathione, leading to hepatotoxicity even at normal doses.",
   wrong:{A:"Acetaminophen is actually preferred over NSAIDs in osteoarthritis — safer for GI and kidneys.",C:"Hypertension is not a contraindication — acetaminophen does not affect blood pressure.",D:"Mild renal insufficiency does not significantly affect acetaminophen metabolism."},
   pearl:"Antidote: Acetylcysteine replenishes glutathione to neutralize NAPQI. Give within 8-10 hours of overdose for best results. In alcoholics: even therapeutic doses may be hepatotoxic."}},

  {drug:"Acetaminophen",module:"Module 2",topic:"Indication",showDrugName:true,
   q:"Acetaminophen is preferred over NSAIDs in which patient scenario?",
   choices:{A:"Patient with peptic ulcer disease needing pain control",B:"Patient with inflammatory arthritis needing anti-inflammatory effect",C:"Patient post-MI needing antiplatelet coverage",D:"Patient needing maximum anti-inflammatory relief"},correct:"A",
   rationale:{correct:"Acetaminophen does not irritate the GI mucosa and has no COX inhibition, making it the safest analgesic for patients with PUD or GI sensitivity.",
   wrong:{B:"Acetaminophen lacks anti-inflammatory properties — NSAIDs or DMARDs are needed.",C:"Aspirin (low-dose) provides antiplatelet coverage — acetaminophen does not.",D:"Acetaminophen has minimal anti-inflammatory effect — NSAIDs are superior for inflammation."},
   pearl:"Safe for GI, kidneys (in therapeutic doses), and platelets. Max 4g/day. Found in hundreds of combination products — always ask patients what OTC medications they take."}},

  // MODULE 3: Aspirin
  {drug:"Aspirin",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A patient with acute MI is given a drug that irreversibly inhibits COX-1 and COX-2, blocking thromboxane A2 and preventing platelet aggregation for the platelet's lifetime. Which drug is this?",
   choices:{A:"Clopidogrel",B:"Heparin",C:"Aspirin",D:"Warfarin"},correct:"C",
   rationale:{correct:"Aspirin irreversibly acetylates COX-1 and COX-2. Inhibiting COX-1 in platelets prevents thromboxane A2 production, blocking platelet aggregation. Because platelets have no nucleus, they cannot regenerate COX — the effect lasts the platelet lifetime (~7-10 days).",
   wrong:{A:"Clopidogrel blocks ADP receptors (P2Y12) on platelets — different antiplatelet mechanism.",B:"Heparin is an anticoagulant via antithrombin III — not antiplatelet.",D:"Warfarin inhibits Vitamin K clotting factor synthesis — not antiplatelet."},
   pearl:"Stop aspirin 7 days before surgery. Tinnitus = early toxicity sign. NEVER in children with viral illness — risk of Reye's syndrome (fatal liver/brain disease). Dose range: 81mg (cardiac protection) to 325-650mg (pain/fever)."}},

  {drug:"Aspirin",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"A parent asks about giving Aspirin to their 8-year-old child with influenza and fever. The nurse's most important response is:",
   choices:{A:"Low-dose aspirin is safe in children with viral illness",B:"Aspirin is contraindicated in children with viral illness due to risk of Reye's syndrome",C:"Aspirin is safe as long as the dose doesn't exceed 325mg",D:"Aspirin can be given if acetaminophen is unavailable"},correct:"B",
   rationale:{correct:"Aspirin + viral illness in children = Reye's syndrome risk — a rare but potentially fatal condition causing acute liver failure and encephalopathy. It is absolutely contraindicated.",
   wrong:{A:"There is no safe dose in children with viral illness — the contraindication is absolute.",C:"Dose does not change the risk of Reye's syndrome — the mechanism is not dose-dependent.",D:"Acetaminophen or ibuprofen are always preferred for pediatric fever."},
   pearl:"Reye's syndrome: aspirin + viral illness (flu, chickenpox) in children = liver failure + brain swelling. Use acetaminophen or ibuprofen for pediatric fever. Adult uses: MI prevention, ACS, stroke prevention, pain, fever."}},

  // Etanercept
  {drug:"Etanercept",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A patient with RA is started on a biologic DMARD that binds and neutralizes TNF-alpha, preventing it from triggering joint inflammation and destruction. Which drug class is described?",
   choices:{A:"Methotrexate — antimetabolite",B:"Etanercept — TNF blocker",C:"Prednisone — corticosteroid",D:"Hydroxychloroquine — antimalarial"},correct:"B",
   rationale:{correct:"Etanercept is a fusion protein (TNF receptor + IgG Fc region) that acts as a decoy receptor, binding and neutralizing TNF-alpha before it can activate synovial inflammation.",
   wrong:{A:"Methotrexate inhibits folic acid/DNA synthesis — not a biologic and doesn't specifically target TNF.",C:"Prednisone broadly suppresses immune function — not TNF-specific.",D:"Hydroxychloroquine modulates lysosomal pH and TLR signaling — different mechanism."},
   pearl:"ALL TNF blockers require NEGATIVE TB test before starting — TNF is essential for TB granuloma containment. Blocking TNF reactivates latent TB. Screen for hepatitis B also. Contraindicated in active infections. Suffix: -ercept."}},

  {drug:"Etanercept",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Before initiating Etanercept for RA, which pre-treatment screening is MOST critical?",
   choices:{A:"Serum creatinine for renal function",B:"Negative tuberculosis (TB) test",C:"Liver function tests",D:"Thyroid function panel"},correct:"B",
   rationale:{correct:"TNF-alpha is essential for maintaining latent TB granulomas. Blocking TNF with etanercept can reactivate latent TB. A negative TB test (PPD or IGRA) is mandatory before starting any TNF blocker.",
   wrong:{A:"Renal function is not the primary concern — etanercept is not significantly nephrotoxic.",C:"LFTs are monitored but TB screening is the most critical mandatory pre-treatment step.",D:"Thyroid function is not directly related to TNF inhibition risks."},
   pearl:"Biologic DMARDs (TNF blockers): etanercept, adalimumab, infliximab — ALL require negative TB screening. Contraindicated in: active infection, lymphoma, CHF, demyelinating disease. Live vaccines contraindicated. Suffix: -ercept (fusion proteins), -mab (monoclonal antibodies)."}},

  // Methotrexate
  {drug:"Methotrexate",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A patient with RA is prescribed a DMARD that inhibits dihydrofolate reductase, blocking folic acid metabolism and DNA synthesis in rapidly dividing immune cells. This same drug is used in oncology at higher doses. Which drug is described?",
   choices:{A:"Hydroxychloroquine",B:"Sulfasalazine",C:"Methotrexate",D:"Leflunomide"},correct:"C",
   rationale:{correct:"Methotrexate is an antimetabolite that inhibits dihydrofolate reductase, blocking the conversion of folate to its active form needed for DNA and RNA synthesis. This slows rapidly dividing immune cells driving RA inflammation.",
   wrong:{A:"Hydroxychloroquine modulates lysosomal pH and TLR signaling — different mechanism.",B:"Sulfasalazine has anti-inflammatory and antimicrobial properties — different mechanism.",D:"Leflunomide inhibits pyrimidine synthesis — related but distinct mechanism."},
   pearl:"Category X — teratogen. Monitor CBC (bone marrow suppression) and LFTs (hepatotoxicity). Weekly dosing for RA — NOT daily. Supplement folic acid 1mg/day to reduce side effects without losing efficacy. Antidote for overdose: Leucovorin (folinic acid)."}},

  {drug:"Methotrexate",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Which finding is an absolute contraindication to starting Methotrexate for RA?",
   choices:{A:"Elevated CRP and ESR",B:"Pregnancy",C:"Mild hypertension",D:"Age over 65"},correct:"B",
   rationale:{correct:"Methotrexate is Pregnancy Category X. It is a known teratogen and abortifacient causing fetal death, neural tube defects, and major malformations. Absolutely contraindicated in pregnancy and requires effective contraception in both men and women of reproductive age.",
   wrong:{A:"Elevated inflammatory markers are indications FOR methotrexate therapy.",C:"Hypertension is not a contraindication.",D:"Age alone is not an absolute contraindication — monitor more closely in elderly."},
   pearl:"Black Box Warnings: hepatotoxicity, bone marrow suppression, pulmonary toxicity, severe teratogenicity. Bone marrow suppression: monitor WBC/Platelets. Hepatotoxicity: monitor LFTs every 3-6 months. Folic acid reduces side effects. Weekly dosing only for RA."}},

  // Amoxicillin
  {drug:"Amoxicillin",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"An antibiotic prescribed for a strep throat infection kills bacteria by inhibiting cell wall synthesis — binding penicillin-binding proteins (PBPs) and preventing peptidoglycan cross-linking. Which drug class does this describe?",
   choices:{A:"Fluoroquinolone — inhibits DNA gyrase",B:"Aminoglycoside — inhibits protein synthesis",C:"Penicillin — inhibits cell wall synthesis",D:"Macrolide — inhibits 50S ribosome"},correct:"C",
   rationale:{correct:"Amoxicillin (a penicillin) inhibits bacterial cell wall synthesis by binding PBPs, preventing peptidoglycan cross-linking. Without a stable cell wall, osmotic pressure causes the bacterium to lyse — bactericidal mechanism.",
   wrong:{A:"Fluoroquinolones (ciprofloxacin) target DNA gyrase/topoisomerase IV.",B:"Aminoglycosides (gentamicin) bind the 30S ribosomal subunit.",D:"Macrolides (azithromycin) inhibit the 50S ribosomal subunit."},
   pearl:"PCN allergy: monitor for rash, urticaria, anaphylaxis. 10% cross-reactivity with cephalosporins. Common GI side effects — take with food. Amoxicillin rash in mononucleosis (EBV) is NOT a true penicillin allergy. Can reduce oral contraceptive efficacy — counsel backup contraception."}},

  {drug:"Amoxicillin",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Amoxicillin is ordered for a patient with otitis media. Which finding requires the nurse to hold the medication and contact the provider immediately?",
   choices:{A:"Mild nausea on previous antibiotics",B:"Documented penicillin allergy with prior anaphylaxis",C:"Current use of oral contraceptives",D:"History of C. difficile 2 years ago with no recurrence"},correct:"B",
   rationale:{correct:"Documented penicillin allergy with anaphylaxis is the primary contraindication. IgE-mediated anaphylaxis can be life-threatening on re-exposure. The provider must be notified to select an alternative.",
   wrong:{A:"Mild nausea is a common GI side effect, not a contraindication.",C:"OCP interaction requires counseling for backup contraception — not a contraindication.",D:"Remote C. diff without recurrence warrants monitoring but is not an absolute contraindication."},
   pearl:"10% cross-reactivity between penicillins and cephalosporins. If true anaphylaxis to PCN, avoid cephalosporins too. Monitor for allergic rash (especially maculopapular rash — common in EBV patients and NOT a true allergy). Diarrhea is common — monitor for C. diff with prolonged use."}},

  // Cefaclor
  {drug:"Cefaclor",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A 2nd-generation cephalosporin is prescribed for a patient with otitis media. Like all beta-lactams, it inhibits bacterial cell wall synthesis. Which critically important pharmacological fact about this drug class must the nurse know?",
   choices:{A:"It inhibits DNA gyrase and is bacteriostatic",B:"It has 10% cross-reactivity with penicillin-allergic patients",C:"It works by inhibiting the 30S ribosomal subunit",D:"It is the drug of choice for MRSA"},correct:"B",
   rationale:{correct:"Cephalosporins share structural similarity with penicillins and have approximately 10% cross-reactivity in penicillin-allergic patients. This is critically important before prescribing — patients with severe PCN allergy (anaphylaxis) may also react to cephalosporins.",
   wrong:{A:"Cefaclor is bactericidal through cell wall synthesis inhibition — not DNA gyrase.",C:"30S ribosomal inhibition is the aminoglycoside/tetracycline mechanism.",D:"Cephalosporins do NOT cover MRSA (except 5th gen ceftaroline)."},
   pearl:"Cefaclor (2nd gen): URI, otitis media, skin infections, UTIs. 10% cross-sensitivity with PCN. Cephalosporins by generation: 1st gen = gram-positive; 2nd gen = extended gram-negative; 3rd gen = serious gram-negative/meningitis; 4th gen = Pseudomonas; 5th gen = MRSA."}},

  // Gentamicin
  {drug:"Gentamicin",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"An antibiotic for severe gram-negative infections irreversibly binds the 30S ribosomal subunit, causing mRNA misreading and inhibiting protein synthesis. Trough levels must be monitored. This drug is both nephrotoxic and ototoxic. Which drug is described?",
   choices:{A:"Doxycycline",B:"Gentamicin",C:"Azithromycin",D:"Ciprofloxacin"},correct:"B",
   rationale:{correct:"Gentamicin is an aminoglycoside that irreversibly binds the 30S ribosome, causing misreading of the genetic code. It is concentration-dependent and bactericidal against gram-negative organisms. Trough monitoring is critical for toxicity prevention.",
   wrong:{A:"Doxycycline reversibly binds the 30S ribosome — bacteriostatic, not bactericidal.",C:"Azithromycin binds the 50S ribosomal subunit — different target.",D:"Ciprofloxacin inhibits DNA gyrase — not ribosomal."},
   pearl:"NEPHROTOXIC and OTOTOXIC. Monitor TROUGHS (before next dose) for toxicity. Elevated troughs = drug accumulation = kidney/ear damage. Signs: rising creatinine (nephrotoxicity), hearing loss or tinnitus (ototoxicity — may be permanent). Use once-daily dosing when possible. Avoid in elderly and pre-existing renal impairment."}},

  {drug:"Gentamicin",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Gentamicin is ordered for a severe gram-negative infection. Which combination of pre-existing conditions poses the greatest risk?",
   choices:{A:"Hypertension on lisinopril",B:"Pre-existing sensorineural hearing loss and CKD stage 3",C:"Penicillin allergy",D:"Type 2 diabetes on metformin"},correct:"B",
   rationale:{correct:"Gentamicin is both nephrotoxic and ototoxic. CKD reduces drug clearance, increasing accumulation and nephrotoxicity risk. Pre-existing hearing loss is dramatically worsened by ototoxicity — which may be permanent and cumulative.",
   wrong:{A:"Hypertension with an ACE inhibitor warrants monitoring but is not the primary safety concern.",C:"PCN allergy is completely unrelated to aminoglycoside therapy.",D:"Diabetes increases nephrotoxicity risk but is not a contraindication with appropriate monitoring."},
   pearl:"Monitor TROUGHS (just before next dose) for nephrotoxicity. Monitor for tinnitus and hearing changes. Hearing loss can be irreversible. Contraindicated in pre-existing hearing loss or severe renal impairment unless absolutely no alternative. Adjust dose for renal function."}},

  // Ciprofloxacin
  {drug:"Ciprofloxacin",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"An antibiotic prescribed for a complicated UTI kills bacteria by inhibiting DNA gyrase and topoisomerase IV, preventing DNA replication. It carries a Black Box Warning for a specific musculoskeletal complication. Which drug class is this?",
   choices:{A:"Penicillins",B:"Tetracyclines",C:"Fluoroquinolones",D:"Sulfonamides"},correct:"C",
   rationale:{correct:"Fluoroquinolones (ciprofloxacin, levofloxacin) inhibit DNA gyrase (topoisomerase II) and topoisomerase IV — enzymes essential for bacterial DNA replication and repair. This results in bactericidal activity.",
   wrong:{A:"Penicillins inhibit cell wall synthesis — not DNA replication.",B:"Tetracyclines inhibit protein synthesis at the 30S ribosome.",D:"Sulfonamides block folic acid synthesis — not DNA directly."},
   pearl:"BLACK BOX WARNING: Tendon rupture (especially Achilles tendon). Risk increases with: age >60, concurrent corticosteroids, renal disease. Avoid in patients <18 (cartilage damage) and >60 (tendon risk). Do not give with antacids/calcium/iron — reduces absorption by 50%. Also causes peripheral neuropathy and CNS effects."}},

  {drug:"Ciprofloxacin",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Ciprofloxacin is prescribed for a 16-year-old patient with a serious infection. The nurse knows fluoroquinolones are generally avoided in patients under 18 because they may cause:",
   choices:{A:"Increased nephrotoxicity in adolescents",B:"Cartilage damage and arthropathy in developing joints",C:"Reduced bioavailability requiring higher pediatric doses",D:"Cardiac QT prolongation only in young patients"},correct:"B",
   rationale:{correct:"Fluoroquinolones impair cartilage development in growing joints (arthropathy was demonstrated in juvenile animals). Generally avoided under 18 except when no alternative exists (anthrax exposure, serious complicated infections).",
   wrong:{A:"Nephrotoxicity is not the primary concern with fluoroquinolones.",C:"Bioavailability is not significantly altered in adolescents.",D:"QT prolongation risk exists in all ages, not just young patients."},
   pearl:"Black Box: Tendon rupture and tendinitis (Achilles most common). Peripheral neuropathy. Avoid age <18 (cartilage), age >60 + steroids (tendon). Separate from antacids, calcium, iron, zinc by 2 hours. DOC for anthrax exposure, uncomplicated UTI, Pseudomonas, some respiratory infections."}},

  // Doxycycline
  {drug:"Doxycycline",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A patient with Lyme disease is prescribed an antibiotic that reversibly binds the 30S ribosomal subunit, blocking tRNA attachment and inhibiting protein synthesis in a bacteriostatic manner. Which drug class is this?",
   choices:{A:"Macrolides — 50S ribosomal inhibitor",B:"Tetracyclines — 30S ribosomal inhibitor",C:"Fluoroquinolones — DNA gyrase inhibitor",D:"Carbapenems — cell wall inhibitor"},correct:"B",
   rationale:{correct:"Tetracyclines (doxycycline) reversibly bind the 30S ribosomal subunit, blocking aminoacyl-tRNA entry into the A site, halting protein synthesis. They are bacteriostatic — they inhibit growth but don't kill directly.",
   wrong:{A:"Macrolides (azithromycin) bind the 50S ribosomal subunit.",C:"Fluoroquinolones inhibit DNA gyrase — not ribosomal.",D:"Carbapenems inhibit cell wall synthesis — bactericidal."},
   pearl:"TEETH STAINING (permanent, yellow-brown) in children under 8 and in fetuses. CONTRAINDICATED in pregnancy and children <8. Photosensitivity — use sunscreen. Take with food (unlike older tetracyclines). Avoid dairy/antacids — calcium chelation reduces absorption. Uses: acne, Lyme disease, chlamydia, malaria prophylaxis, MRSA skin infections."}},

  {drug:"Doxycycline",module:"Module 3",topic:"Contraindication",showDrugName:true,
   q:"Doxycycline is considered for a 6-year-old child with a tick-borne illness. The primary risk that makes this drug generally contraindicated in young children is:",
   choices:{A:"Nephrotoxicity and electrolyte imbalance",B:"Permanent dental staining and enamel hypoplasia",C:"Seizures from CNS penetration",D:"Cardiac arrhythmias at therapeutic doses"},correct:"B",
   rationale:{correct:"Tetracyclines chelate calcium and deposit in developing teeth and bones, causing permanent yellow-brown staining and enamel hypoplasia in children under 8 and in fetuses exposed in utero.",
   wrong:{A:"Nephrotoxicity is not a primary concern with doxycycline at therapeutic doses.",C:"CNS seizures are not associated with doxycycline.",D:"Cardiac arrhythmias are not a known therapeutic dose complication of doxycycline."},
   pearl:"Contraindicated in pregnancy (all trimesters) and children <8 (teeth/bones). Exception: Rocky Mountain Spotted Fever — benefits may outweigh risks even in young children due to disease severity. Take with food. No dairy or antacids (calcium chelation). Photosensitivity — wear sunscreen."}},

  // Cotrimoxazole
  {drug:"Cotrimoxazole",module:"Module 3",topic:"MOA",showDrugName:false,
   q:"A patient with a UTI is given a sulfonamide that works by double-blocking bacterial folic acid synthesis. Bacteria cannot absorb folate from the environment and must synthesize it — humans absorb it from diet. What important side effect requires patient education?",
   choices:{A:"Must drink large amounts of water to prevent crystalluria",B:"Must avoid sunlight to prevent severe burns",C:"Must avoid all dairy products during treatment",D:"Must take on a completely empty stomach"},correct:"A",
   rationale:{correct:"Sulfonamides can precipitate in urine and form crystals (crystalluria), causing painful urination and potentially obstructing the urinary tract. Patients should drink at least 8 glasses of water daily during treatment.",
   wrong:{B:"Photosensitivity exists but is not the critical fluid-related education point.",C:"Dairy avoidance is important for tetracyclines (calcium chelation) — not sulfonamides.",D:"Cotrimoxazole can be taken with food to reduce GI upset."},
   pearl:"Drink lots of water to prevent crystalluria. Contraindicated in sulfa allergy — watch for SJS (Stevens-Johnson Syndrome) risk. Uses: UTI, otitis media, PCP pneumonia (HIV patients), Nocardia infections. Blocks folic acid synthesis at TWO steps: sulfamethoxazole (early) + trimethoprim (later). 'Sulfa' drugs — remember sulfa allergy cross-reactivity (furosemide, thiazides, some sulfonylureas)."}},

  // MODULE 4: Heparin
  {drug:"Heparin",module:"Module 4",topic:"MOA",showDrugName:false,
   q:"A patient with a DVT is started on IV anticoagulation that works by binding antithrombin III, dramatically accelerating its inhibition of thrombin and Factor Xa. It prevents new clot formation but does NOT dissolve existing clots. Which drug is described?",
   choices:{A:"Warfarin",B:"Apixaban",C:"Heparin",D:"Alteplase"},correct:"C",
   rationale:{correct:"Heparin is an indirect thrombin inhibitor — it binds antithrombin III and causes a conformational change that accelerates its inhibition of thrombin (Factor IIa) and Factor Xa by 1000-fold. It prevents further thrombosis but does not lyse existing clots.",
   wrong:{A:"Warfarin inhibits Vitamin K-dependent clotting factor synthesis (2,7,9,10).",B:"Apixaban directly inhibits Factor Xa without requiring antithrombin III.",D:"Alteplase is a thrombolytic — it dissolves existing clots via plasminogen activation."},
   pearl:"Antidote: Protamine Sulfate. Monitor aPTT (therapeutic 1.5-2.5x normal). Watch for HIT (Heparin-Induced Thrombocytopenia) — platelet drop 5-10 days after starting. HIT = STOP heparin + start direct thrombin inhibitor (argatroban). HIT is paradoxically thrombotic despite low platelets."}},

  {drug:"Heparin",module:"Module 4",topic:"Contraindication",showDrugName:true,
   q:"A patient with a history of Heparin-Induced Thrombocytopenia (HIT) develops a new DVT. The nurse understands:",
   choices:{A:"Low-dose SQ heparin is safe in patients with prior HIT",B:"Heparin is safe if the current platelet count is normal",C:"All forms of heparin are absolutely contraindicated lifelong",D:"Heparin contraindication expires after 6 months"},correct:"C",
   rationale:{correct:"HIT is an immune-mediated reaction where antibodies form against heparin-PF4 complexes. Once a patient has HIT, ALL forms of heparin — IV, subcutaneous, LMWH, even catheter flushes — are absolutely contraindicated. There is no safe dose or form.",
   wrong:{A:"No heparin form is safe in patients with HIT history — the reaction is antibody-mediated.",B:"Normal platelet count does not eliminate the risk — antibodies can still be present.",D:"HIT antibodies can persist for years — the contraindication is lifelong."},
   pearl:"HIT: Platelet drop >50% after 5-10 days of heparin. PARADOXICAL THROMBOSIS (not bleeding). Stop ALL heparin immediately — even flushes. Switch to: argatroban or bivalirudin (direct thrombin inhibitors). Document prominently in the medical record. Protamine sulfate reverses unfractionated heparin."}},

  // Warfarin
  {drug:"Warfarin",module:"Module 4",topic:"MOA",showDrugName:false,
   q:"A patient with A-fib is started on an oral anticoagulant that prevents carboxylation of clotting factors 2, 7, 9, and 10 by antagonizing a fat-soluble vitamin. Monitoring requires regular blood tests. Which drug is described?",
   choices:{A:"Apixaban — Factor Xa inhibitor",B:"Clopidogrel — ADP receptor blocker",C:"Warfarin — Vitamin K antagonist",D:"Heparin — antithrombin III enhancer"},correct:"C",
   rationale:{correct:"Warfarin inhibits Vitamin K epoxide reductase, preventing recycling of active Vitamin K. Vitamin K is required for carboxylation (activation) of clotting factors 2, 7, 9, and 10. Without active Vitamin K, these factors cannot be produced.",
   wrong:{A:"Apixaban directly inhibits Factor Xa — does not affect Vitamin K.",B:"Clopidogrel is an antiplatelet blocking ADP receptors — not an anticoagulant.",D:"Heparin activates antithrombin III — not related to Vitamin K."},
   pearl:"Antidote: Vitamin K (slow — 4-6 hours) or FFP (immediate). Monitor PT/INR (therapeutic 2-3). NARROW THERAPEUTIC INDEX — many drug/food interactions. Consistent Vitamin K intake is key. Contraindicated in pregnancy (crosses placenta — fetal hemorrhage/birth defects). Prefix: 'War' (remember: it's at WAR with Vitamin K)."}},

  {drug:"Warfarin",module:"Module 4",topic:"Contraindication",showDrugName:true,
   q:"A pregnant patient at 18 weeks needs anticoagulation for a DVT. Warfarin is avoided because:",
   choices:{A:"It is not effective for DVT treatment",B:"It crosses the placenta, causing fetal hemorrhage and warfarin embryopathy",C:"INR monitoring is unreliable in pregnancy",D:"It interacts with prenatal vitamins reducing efficacy"},correct:"B",
   rationale:{correct:"Warfarin crosses the placenta freely. In the 1st trimester it causes warfarin embryopathy (nasal hypoplasia, bone stippling). In 2nd/3rd trimesters it causes fetal hemorrhage. LMWH (enoxaparin) is the safe alternative — it does not cross the placenta.",
   wrong:{A:"Warfarin IS effective for DVT — the issue is fetal safety, not efficacy.",C:"INR can be monitored in pregnancy — this is not the primary reason for avoidance.",D:"Minor vitamin interaction is not the contraindication rationale."},
   pearl:"CONTRAINDICATED in pregnancy (Category X). Crosses placenta = fetal harm. Use LMWH (enoxaparin) in pregnancy — doesn't cross placenta. Monitor PT/INR in all patients. Antidote: Vitamin K. Warfarin is actually compatible with breastfeeding (per current evidence) unlike historical teaching."}},

  // Alteplase
  {drug:"Alteplase",module:"Module 4",topic:"MOA",showDrugName:false,
   q:"A patient arrives with acute ischemic stroke. A drug is ordered that converts plasminogen to plasmin, which then dissolves fibrin clots. What is the absolute time window requirement for this drug?",
   choices:{A:"Within 12 hours of symptom onset",B:"Within 3-4.5 hours of symptom onset",C:"Within 24 hours",D:"Must be given within 1 hour only"},correct:"B",
   rationale:{correct:"Alteplase (tPA) must be given within 3-4.5 hours of ischemic stroke symptom onset. Beyond this window, the risk of hemorrhagic transformation outweighs benefit. The mechanism: tPA activates plasminogen to plasmin, which cleaves fibrin clots.",
   wrong:{A:"12 hours far exceeds the evidence-based window for most patients.",C:"24 hours — hemorrhagic transformation risk is significantly elevated by this point.",D:"While sooner is better, the extended window is up to 3-4.5 hours, not 1 hour."},
   pearl:"TIME IS BRAIN — every minute of stroke = ~1.9 million neurons lost. Door-to-needle goal: <60 minutes. Contraindications: recent surgery/trauma, intracranial hemorrhage, uncontrolled HTN (>185/110), active bleeding, anticoagulation. Used for: ischemic stroke, massive PE, STEMI. Suffix: -plase."}},

  // Clopidogrel
  {drug:"Clopidogrel",module:"Module 4",topic:"MOA",showDrugName:false,
   q:"A patient post-coronary stent receives a drug that permanently blocks P2Y12 (ADP) receptors on platelets, preventing platelet activation. The patient asks how long before surgery this should be stopped. What is the answer?",
   choices:{A:"24 hours",B:"3 days",C:"5 days",D:"10 days"},correct:"C",
   rationale:{correct:"Clopidogrel irreversibly blocks P2Y12 ADP receptors on platelets. Since platelets have no nucleus, they cannot regenerate the receptor — the effect lasts the platelet's lifetime (~7-10 days). Stopping 5 days before surgery allows adequate recovery of platelet function.",
   wrong:{A:"24 hours is insufficient — the drug's platelet effect is irreversible.",B:"3 days is insufficient platelet function recovery time.",D:"10 days is longer than necessary — 5 days is the standard recommendation."},
   pearl:"Stop 5 days before surgery (aspirin: 7 days). Dual antiplatelet therapy (aspirin + clopidogrel) is standard after ACS/stent. Clopidogrel is a prodrug requiring CYP2C19 activation — poor metabolizers (genetic polymorphism) have reduced efficacy. Omeprazole inhibits CYP2C19 — reduces clopidogrel's antiplatelet effect."}},

  // Epoetin Alfa
  {drug:"Epoetin Alfa",module:"Module 4",topic:"MOA",showDrugName:false,
   q:"A CKD patient with Hgb 8.2 g/dL is prescribed a drug that mimics endogenous erythropoietin, stimulating bone marrow erythroid progenitors to produce more red blood cells. Which hemoglobin level triggers the Black Box Warning for stroke risk?",
   choices:{A:"Greater than 8 g/dL",B:"Greater than 9 g/dL",C:"Greater than 11 g/dL",D:"Greater than 13 g/dL"},correct:"C",
   rationale:{correct:"Epoetin alfa (and darbepoetin) carry a Black Box Warning for increased risk of stroke, MI, and tumor progression when hemoglobin exceeds 11 g/dL. Target Hgb: 10-11 g/dL — do NOT over-treat.",
   wrong:{A:"Hgb >8 is the typical threshold for considering ESA therapy — not the danger threshold.",B:"Hgb >9 is still below the danger threshold.",D:"Hgb >13 is too high a threshold — risks begin at >11 g/dL."},
   pearl:"Target Hgb: 10-11 g/dL. Hgb >11 = increased stroke/MI/tumor progression risk. Uncontrolled HTN is a contraindication. Monitor blood pressure — can increase with ESA therapy. Used for: CKD anemia, chemotherapy-induced anemia, pre-surgical RBC augmentation."}},

  // Filgrastim
  {drug:"Filgrastim",module:"Module 4",topic:"Indication",showDrugName:true,
   q:"Filgrastim (Neupogen) is ordered for a chemotherapy patient. The nurse understands this drug's primary purpose is to:",
   choices:{A:"Stimulate red blood cell production to treat chemo-induced anemia",B:"Stimulate neutrophil production to reduce risk of febrile neutropenia",C:"Prevent thrombocytopenia by stimulating platelet precursors",D:"Reduce chemotherapy-induced nausea and vomiting"},correct:"B",
   rationale:{correct:"Filgrastim is a granulocyte-colony stimulating factor (G-CSF) that stimulates bone marrow to produce and release neutrophils. It shortens the duration and severity of neutropenia after chemotherapy, reducing the risk of life-threatening infections.",
   wrong:{A:"Epoetin alfa or darbepoetin alfa stimulate RBC production — not filgrastim.",C:"Oprelvekin (IL-11) stimulates platelet production — not filgrastim.",D:"Antiemetics (ondansetron) are used for chemotherapy-induced nausea."},
   pearl:"BONE PAIN is the most common expected side effect — caused by rapid bone marrow expansion. Treat with acetaminophen. Suffix: -grastim. Do NOT use if neutropenia is from bone marrow cancer (may stimulate malignant cells). Monitor CBC and watch for splenomegaly with chronic use."}},

  // Cyanocobalamin
  {drug:"Cyanocobalamin",module:"Module 4",topic:"Indication",showDrugName:true,
   q:"A patient is diagnosed with pernicious anemia. The nurse understands Cyanocobalamin must be given by which route for this specific condition?",
   choices:{A:"Oral tablets daily",B:"Sublingual dissolving tablets",C:"IM injection for life",D:"IV infusion monthly"},correct:"C",
   rationale:{correct:"Pernicious anemia is caused by autoimmune destruction of parietal cells → no intrinsic factor (IF) → oral B12 cannot be absorbed in the terminal ileum. IM injection bypasses GI absorption entirely, delivering B12 regardless of IF status.",
   wrong:{A:"Oral B12 requires intrinsic factor — pernicious anemia patients cannot absorb it orally.",B:"Small amounts can absorb sublingually passively, but IM injection is the definitive treatment.",D:"IV B12 infusion is not the standard route — IM injection is preferred."},
   pearl:"Pernicious anemia = no intrinsic factor → oral B12 useless → IM injection FOR LIFE. B12 deficiency causes: megaloblastic anemia + subacute combined degeneration of spinal cord (neuro symptoms — distinguishes it from folate deficiency which does NOT cause neurological symptoms). Monthly IM injections maintain adequate levels."}},

  // MODULE 5: Donepezil
  {drug:"Donepezil",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A patient with Alzheimer's disease is started on a drug that inhibits acetylcholinesterase, preventing breakdown of ACh in the synaptic cleft, temporarily improving cognitive function. At what time of day should this drug be administered?",
   choices:{A:"With breakfast — improves morning cognition",B:"At bedtime — minimizes GI effects and vivid dreams",C:"Twice daily with meals",D:"Only during cognitive symptom exacerbations"},correct:"B",
   rationale:{correct:"Donepezil is given once daily at bedtime (HS). This minimizes GI side effects (nausea, diarrhea) and any vivid dreams associated with increased cholinergic activity during sleep are less disruptive at night.",
   wrong:{A:"Morning dosing increases daytime GI side effects and can disrupt sleep with vivid dreams.",C:"Donepezil has a long half-life (~70 hours) — once daily dosing is sufficient.",D:"Donepezil is taken continuously as maintenance — not episodically."},
   pearl:"Give at BEDTIME (HS). Monitor HEART RATE — increased ACh can cause bradycardia. Treats symptoms only — does NOT slow disease progression. Also used in vascular dementia and Lewy body dementia. Other cholinesterase inhibitors: rivastigmine, galantamine. For severe Alzheimer's, add memantine (NMDA antagonist)."}},

  // Levodopa-Carbidopa
  {drug:"Levodopa-Carbidopa",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A Parkinson's patient is started on a combination drug — one component is a dopamine precursor that crosses the BBB, and the second prevents its peripheral conversion, reducing side effects. Which dietary factor must be separated from dosing times?",
   choices:{A:"Foods high in sodium",B:"Foods high in protein (amino acids)",C:"Foods high in vitamin K",D:"Foods containing grapefruit"},correct:"B",
   rationale:{correct:"Levodopa competes with large neutral amino acids (from dietary protein) for the same transport system across the blood-brain barrier. Taking the drug with high-protein meals significantly reduces the amount reaching the brain. Take on an empty stomach or with low-protein foods.",
   wrong:{A:"Sodium does not compete with levodopa absorption.",C:"Vitamin K is relevant to warfarin — not levodopa.",D:"Grapefruit affects CYP3A4 enzyme substrates — not levodopa."},
   pearl:"AVOID HIGH PROTEIN at dosing time — amino acids compete with levodopa for BBB transport. Carbidopa blocks peripheral decarboxylase — more levodopa reaches the brain, less peripheral side effects (nausea, hypotension). 'On-off' phenomenon: motor fluctuations with long-term use. Take on EMPTY STOMACH for best absorption. Contraindicated in narrow-angle glaucoma."}},

  // Benztropine
  {drug:"Benztropine",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A Parkinson's patient with prominent tremor is given an anticholinergic that blocks muscarinic receptors, restoring dopamine-acetylcholine balance in the basal ganglia. Which mnemonic represents its side effects?",
   choices:{A:"'SLUDGE' — Salivation, Lacrimation, Urination, Defecation, GI upset, Emesis",B:"'Can't see, pee, spit, or s**t' — classic anticholinergic side effects",C:"'RED' — Rash, Edema, Dyspnea",D:"'HALT' — Hunger, Ataxia, Lethargy, Tachycardia"},correct:"B",
   rationale:{correct:"Benztropine causes classic anticholinergic side effects: blurred vision (can't see — cycloplegia/mydriasis), urinary retention (can't pee), dry mouth (can't spit — decreased salivation), constipation (can't s**t — decreased GI motility).",
   wrong:{A:"SLUDGE describes CHOLINERGIC excess effects — the OPPOSITE of benztropine (anticholinergic).",C:"RED is not a pharmacological mnemonic for anticholinergic drugs.",D:"HALT is not a recognized anticholinergic side effect mnemonic."},
   pearl:"Anticholinergic side effects: blurred vision, urinary retention, dry mouth, constipation, tachycardia, confusion. CONTRAINDICATED in BPH (urinary retention risk) and glaucoma (increased IOP). Use with caution in elderly — can cause delirium. Most effective for tremor in Parkinson's — less effective for rigidity/bradykinesia."}},

  // Phenytoin
  {drug:"Phenytoin",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A patient with tonic-clonic seizures is started on a drug that stabilizes voltage-gated sodium channels in their inactive state, preventing repetitive neuronal firing. Therapeutic drug level must be monitored. What is a distinctive physical side effect of chronic use?",
   choices:{A:"Hair loss and brittle nails",B:"Gingival hyperplasia (gum overgrowth)",C:"Yellow skin discoloration",D:"Peripheral pitting edema"},correct:"B",
   rationale:{correct:"Phenytoin causes gingival hyperplasia (gum overgrowth) — a classic and distinctive side effect seen with chronic use. Good oral hygiene and regular dental visits are essential. Other side effects include hirsutism, acne, coarse facial features, and at toxic levels: nystagmus and ataxia.",
   wrong:{A:"Hair loss is not a primary phenytoin side effect.",C:"Yellow skin discoloration is associated with digoxin toxicity or jaundice.",D:"Peripheral edema is not a typical phenytoin side effect."},
   pearl:"GINGIVAL HYPERPLASIA = classic phenytoin (Dilantin). Therapeutic level: 10-20 mcg/mL. Zero-order kinetics at high doses — small dose increases cause large level jumps (toxicity risk). IV: give SLOWLY (<50 mg/min) — causes cardiac arrhythmias if rapid. Monitor: CBC, LFTs, drug levels. Drug interactions: induces CYP enzymes."}},

  // Valproic Acid
  {drug:"Valproic Acid",module:"Module 5",topic:"Contraindication",showDrugName:true,
   q:"Valproic Acid is being considered for a patient with epilepsy. Which finding is an absolute contraindication?",
   choices:{A:"History of mild depression",B:"Pregnancy — first trimester",C:"Concurrent use of acetaminophen",D:"Age over 65 with polypharmacy"},correct:"B",
   rationale:{correct:"Valproic acid is teratogenic — causes neural tube defects (spina bifida), cognitive impairment, and other fetal malformations. It carries a Black Box Warning for fetal harm. Absolutely contraindicated in pregnancy, particularly the first trimester.",
   wrong:{A:"Depression is not a contraindication — valproic acid is actually used for bipolar disorder.",C:"Acetaminophen interaction exists but is not an absolute contraindication.",D:"Age and polypharmacy increase monitoring needs but are not absolute contraindications."},
   pearl:"BLACK BOX WARNINGS: Hepatotoxicity (especially in children under 2), pancreatitis, and fetal harm (neural tube defects). Monitor LFTs and serum levels (therapeutic 50-100 mcg/mL). BROAD SPECTRUM anticonvulsant — treats absence + tonic-clonic. Also: bipolar disorder, migraine prophylaxis. Drug of choice when multiple seizure types coexist."}},

  // Ethosuximide
  {drug:"Ethosuximide",module:"Module 5",topic:"Indication",showDrugName:true,
   q:"A 9-year-old has brief episodes of staring blankly and blinking, occurring up to 50 times daily. EEG shows 3Hz spike-and-wave pattern. Which drug is the first-line treatment?",
   choices:{A:"Phenytoin",B:"Carbamazepine",C:"Ethosuximide",D:"Diazepam"},correct:"C",
   rationale:{correct:"These are classic absence (petit mal) seizures. Ethosuximide is the drug of choice — it depresses the motor cortex and reduces T-type calcium channel activity in the thalamus that generates the 3Hz spike-wave discharge.",
   wrong:{A:"Phenytoin treats tonic-clonic and partial seizures — not effective for absence.",B:"Carbamazepine can actually WORSEN absence seizures — avoid.",D:"Diazepam treats acute/emergency seizures — not for chronic absence seizure prevention."},
   pearl:"Ethosuximide = ONLY for absence seizures (petit mal). NOT effective for other seizure types. 3Hz spike-and-wave on EEG = absence epilepsy. Children often confused with daydreaming. Valproic acid is alternative if patient also has tonic-clonic seizures. Carbamazepine contraindicated in absence — may worsen it."}},

  // Morphine
  {drug:"Morphine",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A post-operative patient requires IV pain medication. A Mu-receptor agonist opioid is ordered. Before administration, the nurse must assess which vital sign parameter?",
   choices:{A:"Blood pressure — hold if systolic <90 mmHg",B:"Respiratory rate — hold if less than 12 breaths/minute",C:"Temperature — hold if above 38.5°C",D:"Heart rate — hold if below 60 bpm"},correct:"B",
   rationale:{correct:"Opioids cause CNS depression including respiratory depression. Respiratory rate less than 12 is a sign of significant respiratory depression — the drug should be held and the provider notified. Naloxone should be readily available.",
   wrong:{A:"Blood pressure monitoring is important but respiratory rate is the critical parameter for opioid administration.",C:"Temperature is not an opioid-specific parameter.",D:"Heart rate monitoring is secondary to respiratory rate for opioid safety."},
   pearl:"ALWAYS check RR before giving opioids — hold if <12 breaths/min. Antidote: NALOXONE (Narcan) — competitive Mu-receptor antagonist. Naloxone has shorter half-life than morphine — may need repeated doses. Also causes: constipation (start stool softener prophylactically), nausea, urinary retention, pruritus. Monitor pain relief and sedation level."}},

  // Diazepam
  {drug:"Diazepam",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A patient in status epilepticus receives a benzodiazepine that enhances GABA-A receptor activity, increasing the FREQUENCY of chloride channel opening and hyperpolarizing neurons. This is different from barbiturates which increase the DURATION. Which drug is being used?",
   choices:{A:"Phenytoin",B:"Valproic acid",C:"Diazepam",D:"Ethosuximide"},correct:"C",
   rationale:{correct:"Diazepam (benzodiazepine) binds the GABA-A receptor at the benzodiazepine site, enhancing GABA activity by increasing FREQUENCY of Cl- channel opening. This hyperpolarizes neurons and stops seizure activity. It is first-line for status epilepticus.",
   wrong:{A:"Phenytoin stabilizes sodium channels — not GABA-mediated mechanism.",B:"Valproic acid increases GABA synthesis/activity but works by different mechanisms.",D:"Ethosuximide works on T-type calcium channels — not GABA-mediated."},
   pearl:"HIGH ADDICTION RISK. Antidote: FLUMAZENIL. Contraindicated in sleep apnea. BZDs: increase FREQUENCY of Cl- channel opening (vs. barbiturates which increase DURATION). Used for: status epilepticus, alcohol withdrawal, anxiety, procedural sedation. Can cause respiratory depression — especially combined with opioids or alcohol."}},

  // Apixaban
  {drug:"Apixaban",module:"Module 5",topic:"MOA",showDrugName:false,
   q:"A patient with A-fib needs stroke prevention. A direct oral anticoagulant (DOAC) is chosen that selectively inhibits Factor Xa and does NOT require INR monitoring. Which drug is described?",
   choices:{A:"Warfarin — Vitamin K antagonist",B:"Heparin — antithrombin III enhancer",C:"Apixaban — direct Factor Xa inhibitor",D:"Clopidogrel — ADP receptor blocker"},correct:"C",
   rationale:{correct:"Apixaban directly and reversibly inhibits Factor Xa, preventing conversion of prothrombin to thrombin. Its predictable pharmacokinetics means INR monitoring is NOT required — a major advantage over warfarin.",
   wrong:{A:"Warfarin requires INR monitoring and has numerous interactions.",B:"Heparin is parenteral only and requires aPTT monitoring.",D:"Clopidogrel is an antiplatelet — not an anticoagulant."},
   pearl:"NO INR monitoring required. Antidote: Andexanet alfa (Factor Xa inhibitor reversal agent — Vitamin K does NOT reverse apixaban). DOACs (apixaban, rivaroxaban, dabigatran) are replacing warfarin for A-fib, DVT, PE. Contraindicated in: active bleeding, prosthetic heart valves, severe renal impairment. Suffix: -xaban."}},

  // MODULE 6: Lisinopril
  {drug:"Lisinopril/Enalapril",module:"Module 6",topic:"MOA",showDrugName:false,
   q:"A patient with HTN and HF is started on a drug that blocks conversion of Angiotensin I to Angiotensin II, reducing vasoconstriction and aldosterone secretion. A persistent dry cough develops. Why does this cough occur?",
   choices:{A:"Direct bronchospasm from reduced angiotensin II",B:"Accumulation of bradykinin which is normally degraded by ACE",C:"Increased histamine release from mast cell activation",D:"Reflex bronchoconstriction from decreased blood pressure"},correct:"B",
   rationale:{correct:"ACE normally degrades bradykinin. Blocking ACE causes bradykinin to accumulate in the lungs, which irritates airway sensory nerves and triggers a persistent dry, non-productive cough. This is the mechanism of ACE inhibitor cough.",
   wrong:{A:"Angiotensin II does not cause bronchospasm directly.",C:"Histamine release is not the cough mechanism.",D:"Reflex bronchoconstriction from BP drop is not the mechanism."},
   pearl:"DRY COUGH = ACE inhibitor side effect (bradykinin accumulation). Switch to ARB (no dry cough) if intolerable. HYPERKALEMIA risk (blocks aldosterone → retains K+). CONTRAINDICATED in pregnancy. ANGIOEDEMA — rare but life-threatening (stop drug, never rechallenge). Monitor: BMP, K+, creatinine. Suffix: -pril."}},

  {drug:"Lisinopril/Enalapril",module:"Module 6",topic:"Contraindication",showDrugName:true,
   q:"A pregnant patient at 20 weeks has hypertension. Lisinopril is contraindicated in pregnancy primarily because it causes:",
   choices:{A:"Excessive maternal hypotension that cannot be managed",B:"Fetal renal damage, oligohydramnios, and limb contractures (ACE inhibitor fetopathy)",C:"Placental abruption through direct uterine effects",D:"Maternal hepatotoxicity risk in pregnancy"},correct:"B",
   rationale:{correct:"ACE inhibitors in the 2nd and 3rd trimesters cause ACE inhibitor fetopathy: fetal renal tubular dysplasia (fetal kidneys need angiotensin II for development), oligohydramnios (reduced fetal urine production), neonatal renal failure, calvarial hypoplasia, and limb contractures.",
   wrong:{A:"Maternal hypotension is a concern but not the primary fetotoxicity mechanism.",C:"Placental abruption is not the primary mechanism of harm.",D:"Maternal hepatotoxicity is not the primary concern with ACE inhibitors in pregnancy."},
   pearl:"ACE inhibitors CONTRAINDICATED in ALL TRIMESTERS (especially 2nd/3rd for fetopathy). Safe alternatives for gestational HTN: methyldopa, labetalol, nifedipine. Angioedema risk: rare but life-threatening — stop immediately. Hyperkalemia risk — avoid with K-sparing diuretics or K+ supplements without monitoring."}},

  // Digoxin
  {drug:"Digoxin",module:"Module 6",topic:"MOA",showDrugName:false,
   q:"A patient with HF and A-fib is on a cardiac glycoside that inhibits Na+/K+ ATPase, indirectly increasing intracellular calcium, strengthening contractions (positive inotrope) and slowing AV conduction (negative chronotrope). Low potassium dramatically increases risk of toxicity. Which drug is described?",
   choices:{A:"Metoprolol",B:"Amiodarone",C:"Digoxin",D:"Diltiazem"},correct:"C",
   rationale:{correct:"Digoxin inhibits Na+/K+ ATPase → intracellular Na+ increases → Na+/Ca2+ exchanger is inhibited → intracellular Ca2+ increases → stronger contractions. It also increases vagal tone to slow AV node conduction. Low K+ means less competition for Na+/K+ pump binding → increased digoxin effect = toxicity.",
   wrong:{A:"Metoprolol is a beta-blocker that slows HR and reduces contractility through beta-1 blockade.",B:"Amiodarone is a K+ channel blocker that prolongs action potential.",D:"Diltiazem is a calcium channel blocker."},
   pearl:"YELLOW-GREEN HALOS = digoxin toxicity (xanthopsia). Check apical pulse 1 full minute — hold if <60 bpm. Therapeutic level: 0.5-2 ng/mL. LOW K+ = INCREASED digoxin toxicity. Antidote: Digibind (digoxin immune Fab). Toxicity signs: N/V, visual changes, bradycardia, dysrhythmias."}},

  // Metoprolol
  {drug:"Metoprolol",module:"Module 6",topic:"MOA",showDrugName:false,
   q:"A diabetic patient on insulin is started on a selective beta-1 blocker for HF. The nurse identifies a critical drug-disease interaction. This drug will:",
   choices:{A:"Increase blood glucose by stimulating hepatic gluconeogenesis",B:"Mask the tachycardia warning sign of hypoglycemia in diabetics",C:"Block insulin receptor signaling, reducing glucose uptake",D:"Directly lower blood glucose causing hypoglycemia"},correct:"B",
   rationale:{correct:"Beta-blockers block beta-2 adrenergic receptors that mediate sympathetic tachycardia in response to hypoglycemia. Without this warning sign, diabetics may not recognize hypoglycemia until they lose consciousness. Sweating (mediated by ACh, not adrenergic) is preserved.",
   wrong:{A:"Beta-blockers do not significantly stimulate hepatic gluconeogenesis.",C:"Beta-blockers do not block insulin receptors.",D:"Beta-blockers do not directly cause hypoglycemia."},
   pearl:"'Masks hypoglycemia tachycardia' — critical teaching for diabetics on beta-blockers. SWEATING IS PRESERVED (cholinergic mediated). Do NOT abruptly stop — rebound hypertension and angina (taper over 1-2 weeks). Contraindicated in: asthma (beta-2 blockade = bronchospasm), bradycardia, 2nd/3rd degree heart block. Suffix: -olol."}},

  // Nitroglycerin
  {drug:"Nitroglycerin",module:"Module 6",topic:"Contraindication",showDrugName:true,
   q:"A patient with chest pain requests their Nitroglycerin. The nurse must first ask about concurrent use of which medication, as the combination causes life-threatening hypotension?",
   choices:{A:"Metformin",B:"Sildenafil (Viagra) or other PDE-5 inhibitors",C:"Atorvastatin",D:"Lisinopril"},correct:"B",
   rationale:{correct:"Both nitroglycerin (nitric oxide → cGMP → vasodilation) and PDE-5 inhibitors (block cGMP breakdown → vasodilation) cause vasodilation by different mechanisms. The combination creates additive, potentially fatal hypotension. If PDE-5 inhibitor taken within 24-48 hours, nitroglycerin is contraindicated.",
   wrong:{A:"Metformin does not affect vasodilation.",C:"Statins don't cause vasodilation — no dangerous interaction.",D:"Lisinopril may mildly lower BP but not to the severe degree of PDE-5 inhibitor combination."},
   pearl:"NTG + Viagra/Cialis = SEVERE HYPOTENSION — contraindicated. Storage: dark glass bottle, cool dry place, replace every 6 months. HEADACHE is expected (cerebral vasodilation). SL dosing: 1 tab every 5 min x3 — if no relief, call 911. Tolerance with continuous use — need 10-12 hour patch-free period daily."}},

  // Atorvastatin
  {drug:"Atorvastatin",module:"Module 6",topic:"MOA",showDrugName:false,
   q:"A patient with hyperlipidemia is started on a drug that inhibits HMG-CoA reductase, blocking the rate-limiting step in hepatic cholesterol synthesis and upregulating LDL receptors. Cola-colored urine would indicate a life-threatening side effect. What is this complication?",
   choices:{A:"Renal tubular acidosis",B:"Rhabdomyolysis with myoglobinuria",C:"Cholestatic jaundice",D:"Hemolytic anemia"},correct:"B",
   rationale:{correct:"Statins can cause rhabdomyolysis — widespread skeletal muscle breakdown. Myoglobin from destroyed muscle is released into the bloodstream, filtered by kidneys, and turns urine cola-brown. This can cause acute renal failure. Report muscle pain, weakness, or dark urine immediately.",
   wrong:{A:"Renal tubular acidosis is not a known statin complication.",C:"Cholestatic jaundice is not a primary statin complication — hepatotoxicity can occur but presents differently.",D:"Hemolytic anemia is not associated with statins."},
   pearl:"RHABDOMYOLYSIS — severe muscle pain + weakness + dark (cola-colored) urine = STOP statin immediately. Check CK level. Risk increases with: high dose, grapefruit juice (inhibits CYP3A4), concurrent fibrates. Contraindicated in pregnancy (Category X) and active liver disease. Suffix: -statin."}},

  // Adenosine
  {drug:"Adenosine",module:"Module 6",topic:"MOA",showDrugName:true,
   q:"A patient with SVT (HR 220 bpm) is about to receive Adenosine. The nurse knows the critical administration requirement is:",
   choices:{A:"Dilute in 250mL NS and infuse over 20 minutes",B:"Rapid IV push over 1-2 seconds followed immediately by a saline flush",C:"Administer IM in the deltoid",D:"Mix with lidocaine and give slowly"},correct:"B",
   rationale:{correct:"Adenosine has an extremely short half-life of ~10 seconds — it is rapidly metabolized by erythrocytes. It MUST be given as a rapid IV bolus (1-2 seconds) followed immediately by a rapid saline flush to ensure it reaches the heart before degradation.",
   wrong:{A:"Slow infusion completely degrades adenosine before it reaches the heart — ineffective.",C:"IM administration results in complete degradation — adenosine cannot be given IM.",D:"Mixing with other drugs dilutes it further and delays delivery."},
   pearl:"RAPID IV PUSH — half-life ~10 seconds. Terminates re-entrant SVT by briefly blocking AV node. Patient WILL feel their heart stop momentarily (warn them). Causes brief: flushing, chest tightness, sense of doom — EXPECTED, transient. Contraindicated in: heart block, WPW syndrome, asthma (bronchospasm). Record rhythm during administration."}},

  // Amiodarone
  {drug:"Amiodarone",module:"Module 6",topic:"Contraindication",showDrugName:true,
   q:"Before starting Amiodarone for ventricular tachycardia, the nurse identifies a critical allergy. Which allergy is most relevant?",
   choices:{A:"Penicillin allergy",B:"Sulfa drug allergy",C:"Iodine allergy",D:"Aspirin allergy"},correct:"C",
   rationale:{correct:"Amiodarone contains approximately 37% iodine by weight. It can trigger thyroid dysfunction in any patient (hypo or hyperthyroidism) and poses additional risks in patients with iodine allergy, including potential severe hypersensitivity reactions.",
   wrong:{A:"PCN allergy is unrelated to amiodarone.",B:"Sulfa allergy relates to sulfonamide antibiotics and some diuretics — not amiodarone.",D:"Aspirin allergy is related to COX inhibition — not relevant to amiodarone."},
   pearl:"Amiodarone side effects: Pulmonary toxicity (most serious — monitor CXR and LFTs regularly), thyroid dysfunction (hypo or hyper), corneal microdeposits (visual halos), photosensitivity (blue-grey skin), hepatotoxicity. LONG half-life (40-55 days) — side effects persist long after stopping. Multiple drug interactions (warfarin, digoxin levels increase). Iodine allergy = critical to assess."}},

  // MODULE 7: Albuterol
  {drug:"Albuterol",module:"Module 7",topic:"MOA",showDrugName:false,
   q:"A patient has an acute asthma attack with severe wheezing. An inhaled drug is given that binds beta-2 receptors in airway smooth muscle, increasing cAMP and causing rapid bronchodilation. This is the rescue inhaler. Which drug is this?",
   choices:{A:"Ipratropium",B:"Fluticasone",C:"Montelukast",D:"Albuterol"},correct:"D",
   rationale:{correct:"Albuterol is a SABA (Short-Acting Beta-2 Agonist) that stimulates beta-2 receptors → adenylyl cyclase activation → increased cAMP → smooth muscle relaxation → bronchodilation. Onset: 5-15 minutes. Duration: 4-6 hours.",
   wrong:{A:"Ipratropium blocks muscarinic receptors — used for COPD maintenance, not acute rescue.",B:"Fluticasone is an inhaled corticosteroid for long-term control — too slow for acute attack.",C:"Montelukast blocks leukotriene receptors for maintenance — onset too slow."},
   pearl:"RESCUE INHALER — for acute attacks ONLY. Expected side effects: tremors, jitteriness, tachycardia (some beta-1 activity). Using rescue inhaler >2 days/week = asthma is NOT controlled → add controller medication (ICS). Hypokalemia with high doses (beta-2 drives K+ into cells). Contraindicated with dysrhythmias."}},

  {drug:"Albuterol",module:"Module 7",topic:"Contraindication",showDrugName:true,
   q:"A patient with asthma has a new diagnosis of a supraventricular tachycardia. The nurse exercises caution with Albuterol because:",
   choices:{A:"It decreases respiratory rate, risking respiratory failure",B:"Its beta-1 activity can cause tachycardia and worsen arrhythmias",C:"It increases mucus production, worsening airway obstruction",D:"It causes vasoconstriction and hypertension"},correct:"B",
   rationale:{correct:"Albuterol has some beta-1 adrenergic activity in addition to beta-2 bronchodilation. This can cause tachycardia and palpitations, potentially worsening pre-existing tachyarrhythmias.",
   wrong:{A:"Albuterol causes bronchodilation — it does not depress respiration.",C:"Albuterol does not increase mucus production.",D:"Albuterol causes vasodilation (beta-2) — not vasoconstriction."},
   pearl:"Rescue only — PRN, not scheduled. Tremors and palpitations = expected. Overuse = poor asthma control = need step-up therapy with ICS (inhaled corticosteroid). Hypokalemia with high doses. If using >2 days/week = step up therapy. MDI technique: shake, exhale, inhale slowly, hold 10 seconds."}},

  // Ipratropium
  {drug:"Ipratropium",module:"Module 7",topic:"MOA",showDrugName:false,
   q:"A COPD patient on maintenance therapy uses an anticholinergic inhaler that blocks M3 muscarinic receptors in airway smooth muscle, reducing bronchoconstriction and secretions. This is NOT a rescue inhaler. The nurse checks the patient's allergy history for which allergen?",
   choices:{A:"Latex allergy",B:"Penicillin allergy",C:"Soy or peanut allergy",D:"Shellfish allergy"},correct:"C",
   rationale:{correct:"Some ipratropium formulations (older Atrovent MDI) used soy lecithin as a propellant. Patients with soy or peanut allergies (cross-reactivity exists) should be assessed before use, particularly with the older formulations.",
   wrong:{A:"Latex allergy is not specifically relevant to ipratropium.",B:"Penicillin allergy has no cross-reactivity with ipratropium.",D:"Shellfish allergy is relevant to iodine contrast — not ipratropium."},
   pearl:"Ipratropium = MAINTENANCE, NOT RESCUE. Suffix: -tropium. Combined with albuterol as Combivent or DuoNeb for COPD exacerbations. Anticholinergic side effects are minimal (inhaled, not systemic): dry mouth, metallic taste. Blurred vision if sprayed in eyes. First-line maintenance for COPD."}},

  // Guaifenesin
  {drug:"Guaifenesin",module:"Module 7",topic:"MOA",showDrugName:false,

// Map to modules
const MODULE_MAP = {};
QUESTION_BANK.forEach(q => {
  if (!MODULE_MAP[q.module]) MODULE_MAP[q.module] = [];
  MODULE_MAP[q.module].push(q);
});

const MODULE_NAMES = Object.keys(MODULE_MAP).sort();
let selectedQCount = 10;
let selectedModules = [...MODULE_NAMES];
let moduleWeights = {};
let questions = [];
let currentQ = 0;
let answers = {};
MODULE_NAMES.forEach(m => moduleWeights[m] = 1);

function initHome() {
  const grid = document.getElementById('modulesGrid');
  grid.innerHTML = '';
  MODULE_NAMES.forEach(mod => {
    const count = MODULE_MAP[mod].length;
    const div = document.createElement('div');
    div.className = 'mod-item selected';
    div.id = 'mod_' + mod.replace(/\s+/g,'_');
    div.onclick = () => toggleModule(mod);
    div.innerHTML = `<div class="mod-num">${mod.toUpperCase()}</div><div class="mod-name">${getModSubtitle(mod)}</div><div class="mod-count">${count} questions</div>`;
    grid.appendChild(div);
  });
  updateSplitControls();
}

function getModSubtitle(mod) {
  const m = {"Module 2":"Core Pharmacology","Module 3":"Immune & Infection","Module 4":"Hematology & Cancer","Module 5":"Nervous System & Pain","Module 6":"Cardiovascular","Module 7":"Pulmonary","Module 8":"Renal & Urinary","Module 9":"Endocrine & Diabetes","Module 10":"GI & Hepatobiliary","Module 11":"Musculoskeletal"};
  return m[mod] || mod;
}

function toggleModule(mod) {
  const idx = selectedModules.indexOf(mod);
  if (idx === -1) selectedModules.push(mod);
  else { if (selectedModules.length === 1) return; selectedModules.splice(idx, 1); }
  document.getElementById('mod_' + mod.replace(/\s+/g,'_')).classList.toggle('selected', selectedModules.includes(mod));
  updateSplitControls();
}

function selectQCount(n, custom=false) {
  if (!custom) { document.getElementById('customQ').value = ''; document.querySelectorAll('.q-btn').forEach(b => b.classList.toggle('selected', parseInt(b.textContent) === n)); }
  selectedQCount = n;
}

function updateSplitControls() {
  const card = document.getElementById('splitCard');
  const container = document.getElementById('splitControls');
  if (selectedModules.length <= 1) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  container.innerHTML = '';
  selectedModules.forEach(mod => {
    const w = moduleWeights[mod] || 1;
    const div = document.createElement('div');
    div.style.marginBottom = '14px';
    div.innerHTML = `<div class="slider-top"><span style="font-size:13px;color:var(--text)">${mod}: <em style="color:var(--muted);font-style:normal">${getModSubtitle(mod)}</em></span><span class="slider-val" id="wval_${mod.replace(/\s+/g,'_')}">${w}x</span></div><input type="range" min="1" max="5" value="${w}" oninput="updateWeight('${mod}', parseInt(this.value))"><div class="slider-hint">Weight: 1 = equal share · 5 = heavily weighted</div>`;
    container.appendChild(div);
  });
  updateSummary();
}

function updateWeight(mod, val) {
  moduleWeights[mod] = val;
  const el = document.getElementById('wval_' + mod.replace(/\s+/g,'_'));
  if (el) el.textContent = val + 'x';
  updateSummary();
}

function updateSummary() {
  const total = selectedModules.reduce((s,m) => s + (moduleWeights[m]||1), 0);
  document.getElementById('splitSummary').textContent = selectedModules.map(m => `${m}: ${Math.round(((moduleWeights[m]||1)/total)*100)}%`).join(' · ');
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz() {
  if (!selectedQCount || selectedQCount < 1) { showHomeError('Please select a number of questions.'); return; }
  if (!selectedModules.length) { showHomeError('Please select at least one module.'); return; }
  document.getElementById('homeError').style.display = 'none';

  let pool = [];
  selectedModules.forEach(mod => {
    const w = moduleWeights[mod] || 1;
    const qs = MODULE_MAP[mod] || [];
    for (let i = 0; i < w; i++) pool = pool.concat(qs);
  });

  pool = shuffleArray(pool);
  const seen = new Set();
  const unique = pool.filter(q => { const k = q.drug+q.topic+q.q.slice(0,40); if (seen.has(k)) return false; seen.add(k); return true; });
  let final = unique.slice(0, Math.min(selectedQCount, unique.length));
  if (final.length < selectedQCount) final = [...final, ...shuffleArray(pool).slice(0, selectedQCount - final.length)];

  questions = final;
  answers = {};
  currentQ = 0;
  showScreen('quiz');
  renderQuizMap();
  renderQuestion(0);
}

function renderQuizMap() {
  const map = document.getElementById('qMap');
  map.innerHTML = '';
  questions.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (i === currentQ ? ' current' : '');
    dot.id = 'dot_' + i;
    dot.textContent = i + 1;
    dot.onclick = () => navigateTo(i);
    if (answers[i]) { dot.classList.add('answered'); if (answers[i].revealed && answers[i].selected !== answers[i].correct) dot.classList.add('wrong'); }
    map.appendChild(dot);
  });
}

function navigateTo(idx) { currentQ = idx; renderQuizMap(); renderQuestion(idx); }

function renderQuestion(idx) {
  const q = questions[idx];
  if (!q) return;
  const ans = answers[idx];
  const revealed = ans && ans.revealed;
  const total = questions.length;
  document.getElementById('progLabel').textContent = `Question ${idx+1} of ${total}`;
  document.getElementById('progPct').textContent = Math.round((idx/total)*100) + '%';
  document.getElementById('progBar').style.width = Math.round((idx/total)*100) + '%';

  const letters = ['A','B','C','D'];
  let choicesHtml = '';
  letters.forEach(l => {
    let cls = 'mc-option';
    if (revealed) { cls += ' disabled'; if (l === q.correct) cls += ' correct'; else if (ans && ans.selected === l) cls += ' incorrect'; }
    else if (ans && ans.selected === l) cls += ' selected';
    const click = revealed ? '' : `onclick="selectChoice('${l}')"`;
    choicesHtml += `<div class="${cls}" ${click}><div class="opt-letter">${l}</div><div class="opt-text">${q.choices[l]}</div></div>`;
  });

  let rationaleHtml = '';
  if (revealed) {
    const wrongHtml = letters.filter(l => l !== q.correct).map(l =>
      `<div class="wrong-item"><span class="wrong-choice">${l}: ${q.choices[l]}</span><br><span class="rat-text">${q.rationale.wrong[l]}</span></div>`
    ).join('');
    rationaleHtml = `<div class="answer-reveal">
      <div class="correct-answer-block"><div class="ca-label">✓ Correct Answer — ${q.correct}</div><div class="ca-text">${q.choices[q.correct]}</div></div>
      <div class="rationale-block">
        <div class="rat-section"><div class="rat-label why">✓ Why This Is Correct</div><div class="rat-text">${q.rationale.correct}</div></div>
        <div class="rat-section"><div class="rat-label wrong">✗ Why Other Choices Are Wrong</div>${wrongHtml}</div>
        <div class="rat-section"><div class="rat-label pearl">★ Clinical Pearl</div><div class="rat-text">${q.rationale.pearl}</div></div>
      </div></div>`;
  }

  const isLast = idx === total - 1;
  let actionHtml = !revealed
    ? `<button class="btn-reveal" onclick="revealAnswer()" ${!ans?.selected ? 'disabled style="opacity:0.4;cursor:not-allowed"' : ''}>Check Answer →</button>`
    : `<div class="nav-row"><button class="nav-btn" onclick="navigateTo(${idx-1})" ${idx===0?'disabled':''}>← Previous</button>${isLast ? `<button class="nav-btn finish-btn" onclick="finishQuiz()">See Results ✓</button>` : `<button class="nav-btn next-btn" onclick="navigateTo(${idx+1})">Next →</button>`}</div>`;

  const drugPill = `<span class="q-pill" style="color:var(--accent);border-color:rgba(79,142,247,0.3);background:rgba(79,142,247,0.08)">${q.drug}</span>`;
  document.getElementById('quizContent').innerHTML = `
    <div class="q-meta"><span class="q-pill mod">${q.module}</span><span class="q-pill topic">${q.topic}</span>${(revealed || q.showDrugName) ? drugPill : ''}</div>
    <div class="q-text">${q.q}</div>
    <div class="mc-options">${choicesHtml}</div>
    ${rationaleHtml}${actionHtml}
    ${revealed ? '' : `<div class="nav-row" style="margin-top:8px"><button class="nav-btn" onclick="navigateTo(${idx-1})" ${idx===0?'disabled':''}>← Previous</button><button class="nav-btn" onclick="navigateTo(${idx+1})" ${idx===total-1?'disabled':''}>Skip →</button></div>`}`;
}

function selectChoice(letter) {
  if (!answers[currentQ]) answers[currentQ] = {};
  if (answers[currentQ].revealed) return;
  answers[currentQ].selected = letter;
  answers[currentQ].correct = questions[currentQ].correct;
  renderQuestion(currentQ);
}

function revealAnswer() {
  if (!answers[currentQ]?.selected) return;
  answers[currentQ].revealed = true;
  renderQuizMap();
  renderQuestion(currentQ);
}

function finishQuiz() {
  const total = questions.length;
  let correct = 0;
  questions.forEach((q,i) => { if (answers[i]?.selected === q.correct) correct++; });
  const pct = Math.round((correct/total)*100);
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = total - correct;
  document.getElementById('statTotal').textContent = total;
  const s = document.getElementById('resultScore');
  s.textContent = pct + '%';
  s.className = 'result-score ' + (pct>=80?'great':pct>=60?'ok':'low');
  const labels = ['Keep studying! You\'ve got this. 💪','Getting there — review the rationales!','Solid work!','Great job!','Outstanding! 🎉'];
  document.getElementById('resultLabel').textContent = labels[pct>=90?4:pct>=80?3:pct>=70?2:pct>=60?1:0];
  showScreen('results');
}

function goHome() { showScreen('home'); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function showHomeError(msg) { const e=document.getElementById('homeError'); e.textContent=msg; e.style.display='block'; }

initHome();
selectQCount(10);

</script>
